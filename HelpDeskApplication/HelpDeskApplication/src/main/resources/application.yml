spring:
  application:
    name: help-desk-backend

  datasource:
    url: jdbc:mysql://localhost:3306/chatbot
    username: root
    password: '@root12'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.7

server:
  port: 8081

logging:
  level:
    root: INFO
    com.Subtring.helpdesk: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
